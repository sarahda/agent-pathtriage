<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="40" y="44" font-size="23" font-weight="bold" fill="#0f172a">Cross-Agent Confused Deputy, reproduced on AWS AgentCore</text>
  <text x="40" y="70" font-size="14" fill="#475569">Every step is permitted; the chain is the escalation.</text>

  <!-- attacker -->
  <rect x="40" y="150" width="150" height="70" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="115" y="182" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Low-priv</text>
  <text x="115" y="200" font-size="13" fill="#991b1b" text-anchor="middle">principal</text>

  <!-- AgentA -->
  <rect x="270" y="150" width="150" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="345" y="180" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">AgentA</text>
  <text x="345" y="200" font-size="12" fill="#3730a3" text-anchor="middle">RoleA (wildcard)</text>

  <!-- AgentB resources -->
  <rect x="540" y="60"  width="180" height="56" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="630" y="86" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">AgentB memory</text>
  <text x="630" y="104" font-size="11" fill="#854d0e" text-anchor="middle">secret stored here</text>

  <rect x="540" y="200" width="180" height="56" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="630" y="226" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">AgentB ECR image</text>
  <text x="630" y="244" font-size="11" fill="#854d0e" text-anchor="middle">container image</text>

  <!-- edges -->
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
        <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker></defs>

  <line x1="190" y1="185" x2="268" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="228" y="176" font-size="11" fill="#334155" text-anchor="middle">invoke</text>

  <line x1="420" y1="175" x2="538" y2="98"  stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="420" y1="195" x2="538" y2="224" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="470" y="120" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">act (wildcard)</text>

  <!-- outcome badges -->
  <rect x="540" y="128" width="180" height="22" rx="11" fill="#dcfce7"/>
  <text x="630" y="144" font-size="11" fill="#166534" text-anchor="middle" font-weight="bold">exfil: secret FOUND + poisoned</text>

  <rect x="540" y="268" width="180" height="22" rx="11" fill="#dcfce7"/>
  <text x="630" y="284" font-size="11" fill="#166534" text-anchor="middle" font-weight="bold">image pulled cross-agent</text>

  <!-- control -->
  <rect x="270" y="330" width="150" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="345" y="358" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">RoleB (scoped)</text>
  <text x="345" y="378" font-size="12" fill="#3730a3" text-anchor="middle">control</text>
  <line x1="420" y1="362" x2="538" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <rect x="540" y="352" width="180" height="22" rx="11" fill="#fee2e2"/>
  <text x="630" y="368" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="bold">AccessDenied (by AWS)</text>

  <text x="40" y="440" font-size="12" fill="#64748b">RoleA reaches AgentB's resources across the agent boundary; RoleB, correctly scoped, is denied by AWS. Clean asymmetry.</text>
</svg>