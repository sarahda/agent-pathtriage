# The action, exercised against this repository's own example template.
#
# Manual and pull-request only, deliberately. Running it on every push would
# spend Actions minutes to re-learn something the test suite already pins, and
# a red check on an unrelated commit is noise. A reviewer who wants to see it
# work can run it from the Actions tab.
#
# The example template has a shared execution role on purpose, so this job is
# expected to report a finding. fail-on-findings is therefore false: the point
# here is that the finding reaches the code scanning tab, not that the
# repository is clean.
name: AgentPathTriage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agentpathtriage/**"
      - "action.yml"
      - "examples/**"
      - ".github/workflows/agentpathtriage.yml"

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e ".[dev,corpus]"
      - run: python -m pytest tests -q

  scan:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - id: triage
        uses: ./
        with:
          path: examples/shared-role
          fail-on-findings: "false"
      - name: The example is expected to report a finding
        shell: bash
        run: |
          # If this example ever scans clean, either the example stopped
          # demonstrating anything or the scanner stopped finding it. Both
          # are worth failing on.
          if [ "${{ steps.triage.outputs.exit-code }}" != "1" ]; then
            echo "::error::expected exit code 1 from examples/shared-role, got ${{ steps.triage.outputs.exit-code }}"
            exit 1
          fi
